<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F1A17">
<title>Granja Los Abrojos · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EE;--card:#FFFFFF;--ink:#1F1A17;--soft:#6A5C53;--line:#E6DCD0;--acc:#B23A0A;--acc-bg:#F8E3D8;--ok:#2F6B2F;--ok-bg:#E3F0DC;--warn:#8A5A00;--warn-bg:#FBEFD2;--bad:#A32020;--bad-bg:#FBE2E2;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#F7F3EE;padding:12px 16px 0}
header .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-family:'EB Garamond',Georgia,serif;font-size:22px;margin:0;font-weight:600}
header .who{font-size:12px;color:#CDBFB2}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#CDBFB2;text-decoration:none;padding:8px 12px 10px;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav a.on{color:#fff;border-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:16px 14px 80px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.metric .lbl{font-size:12px;color:var(--soft)}
.metric .val{font-size:24px;font-weight:600;margin-top:2px}
.metric.bad{background:var(--bad-bg);border-color:#F2C4C4}.metric.bad .val{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--soft);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
label{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:12px;color:var(--soft);font-weight:500;background:#FBF8F4}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#EFE6DC;color:var(--soft)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.acc{background:var(--acc-bg);color:var(--acc)}
.list .item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:14px}
.scroll{overflow-x:auto}
dialog{border:none;border-radius:16px;padding:0;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(31,26,23,.5)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600}
dialog .bd{padding:4px 16px 16px;overflow:auto;max-height:70vh}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.items .it{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;margin-bottom:6px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login h1{font-family:'EB Garamond',Georgia,serif;font-size:34px;margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:50}
.empty{padding:24px;text-align:center;color:var(--soft)}
.chk{display:flex;gap:6px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink);font-size:14px;border:1px solid var(--line);padding:5px 9px;border-radius:999px}.chk input{width:auto}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><div class="hd"><span id="dlgT"></span><button class="btn sm" onclick="dlg.close()">Cerrar</button></div><div class="bd" id="dlgB"></div><div class="ft" id="dlgF"></div></dialog>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://pmnmkqlnkasmhlvbhgoy.supabase.co','sb_publishable_MpvFWRMwJ9K3gofgbsM8pA_Xt20zpbJ');
const $ = s => document.querySelector(s);
const app = $('#app'), dlg = $('#dlg');
window.dlg = dlg;
const DIAS = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + Math.round(Number(n)||0).toLocaleString('es-AR');
const num = (n,d=2) => (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:d});
const iso = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const hoy = () => iso(new Date());
const fdate = s => s ? new Date(s+'T12:00').toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}) : '—';
const semanaDe = s => { const a=cache.config?.lunes_semana_a; if(!a) return null; const d=(new Date(lunesDe(s)+'T12:00')-new Date(a+'T12:00'))/864e5/7; return ((Math.round(d)%2)+2)%2===0?'A':'B'; };
const lunesDe = s => { const d=new Date(s+'T12:00'); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); };
const sumar = (s,n) => { const d=new Date(s+'T12:00'); d.setDate(d.getDate()+n); return iso(d); };
const unidad = u => u==='kg'?'u.':u;
const kgTxt = i => { const k = i.peso_real ?? i.kilos_estimados; return k!=null ? (i.peso_real!=null?'':'≈')+num(Number(k))+' kg' : ''; };
const piezaTxt = p => p.unidad==='kg'&&p.peso_aprox_kg ? ` · ≈${num(Number(p.peso_aprox_kg))} kg ≈${money(p.precio*p.peso_aprox_kg)} c/u` : '';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600);}
async function q(p){const {data,error}=await p; if(error){toast('Error: '+error.message); throw error;} return data;}
function modal(title, body, actions){ $('#dlgT').textContent=title; $('#dlgB').innerHTML=body; const f=$('#dlgF'); f.innerHTML=''; (actions||[]).forEach(([t,fn,cls])=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=t;b.onclick=fn;f.appendChild(b);}); dlg.showModal(); }
function excel(nombre, filas){ if(!filas.length){toast('No hay datos para exportar');return;} const ws=XLSX.utils.json_to_sheet(filas); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,nombre.slice(0,30)); XLSX.writeFile(wb, nombre+'.xlsx'); }
window.excel = excel;

let cache = {};
async function cargarBase(force){
  if(cache.productos && !force) return;
  const [productos, zonas, barrios, clientes, proveedores, config] = await Promise.all([
    q(sb.from('productos').select('*').order('orden')),
    q(sb.from('zonas').select('*').order('orden')),
    q(sb.from('barrios').select('*, zonas(nombre)').order('nombre')),
    q(sb.from('clientes').select('*, barrios(nombre, zona_id)').order('nombre')),
    q(sb.from('proveedores').select('*, producto_proveedor(producto_id,costo)').order('nombre')),
    q(sb.from('config').select('*').single())
  ]);
  cache = {productos, zonas, barrios, clientes, proveedores, config};
}
const prod = id => cache.productos.find(p=>p.id===id);
const zonaDeBarrio = id => { const b=cache.barrios.find(x=>x.id===id); return b && cache.zonas.find(z=>z.id===b.zona_id); };

const SECCIONES = [['inicio','Inicio'],['avisos','Avisos'],['pedidos','Pedidos'],['reparto','Reparto'],['stock','Stock'],['compras','Compras'],['cobros','Cobros'],['contable','Contable'],['clientes','Clientes'],['productos','Productos'],['proveedores','Proveedores'],['planillas','Planillas'],['ajustes','Ajustes']];
let usuario = null;

async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return pantallaLogin();
  usuario = session.user;
  const { data: ok } = await sb.rpc('es_equipo');
  if(!ok){ app.innerHTML = `<div class="login"><h1>Granja Los Abrojos</h1><p>El usuario <b>${esc(usuario.email)}</b> todavía no tiene acceso al panel. Pedile a Me Encargo que lo habilite.</p><button class="btn" id="out">Salir</button></div>`; $('#out').onclick=()=>sb.auth.signOut().then(()=>location.reload()); return; }
  app.innerHTML = `<header><div class="top"><h1>Granja Los Abrojos</h1><div class="row"><span class="who">${esc(usuario.email)}</span><button class="btn sm" id="out" style="background:transparent;color:#CDBFB2;border-color:#45392F">Salir</button></div></div><nav id="nav">${SECCIONES.map(([k,t])=>`<a href="#${k}" data-k="${k}">${t}</a>`).join('')}</nav></header><main id="main"></main>`;
  $('#out').onclick=()=>sb.auth.signOut().then(()=>location.reload());
  await cargarBase(true);
  window.onhashchange = ruta; ruta();
}

function pantallaLogin(){
  app.innerHTML = `<div class="login"><h1>Granja Los Abrojos</h1><p class="muted">Panel de pedidos, stock y cobros</p>
  <label>Tu mail</label><input id="em" type="email" placeholder="nombre@gmail.com" autocomplete="email">
  <button class="btn pri" id="go" style="width:100%;margin-top:12px">Recibir link para entrar</button>
  <p class="muted" id="msg" style="margin-top:12px"></p></div>`;
  $('#go').onclick = async () => {
    const email = $('#em').value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(email)){ $('#msg').textContent='Escribí un mail válido.'; return; }
    $('#go').disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin } });
    $('#msg').textContent = error ? 'No se pudo enviar: '+error.message : 'Listo. Revisá tu mail y tocá el link para entrar.';
    $('#go').disabled = false;
  };
}

/* ---------- Avisos ---------- */
async function calcAvisos(){
  const h = hoy(); const enUnaSemana = sumar(h,7); const mes = h.slice(0,7);
  const [manuales, bols, saldos, stock, fijos, gastosMes] = await Promise.all([
    q(sb.from('avisos').select('*').eq('resuelto',false).order('creado_en')),
    q(sb.from('facturas_proveedor').select('id,monto,vence,fecha,proveedores(nombre)').eq('pagada',false)),
    q(sb.from('v_saldos').select('*').gt('saldo',0)),
    q(sb.from('v_stock').select('*')),
    q(sb.from('gastos_fijos').select('*').eq('activo',true)),
    q(sb.from('gastos').select('descripcion').gte('fecha',mes+'-01'))
  ]);
  const L = [];
  manuales.forEach(a=>L.push({id:'m'+a.id, manual:a.id, nivel: a.tipo==='precios'?'media':'info', grupo: ({precios:'Precios',pagos:'Pagos',cobros:'Cobros',stock:'Stock',general:'Configuración'})[a.tipo], titulo:a.titulo, detalle:a.detalle}));
  // Pagos a proveedores
  const venc = bols.filter(b=>b.vence && b.vence < h), prox = bols.filter(b=>b.vence && b.vence >= h && b.vence <= enUnaSemana), sinV = bols.filter(b=>!b.vence);
  if(venc.length) L.push({nivel:'alta', grupo:'Pagos', titulo:`${venc.length} boleta${venc.length>1?'s':''} vencida${venc.length>1?'s':''} por ${money(venc.reduce((a,b)=>a+Number(b.monto),0))}`, detalle: venc.map(b=>`${b.proveedores?.nombre||'Sin proveedor'}: ${money(b.monto)} (venció ${fdate(b.vence)})`).join(' · '), link:'#contable', tab:'boletas'});
  if(prox.length) L.push({nivel:'media', grupo:'Pagos', titulo:`${prox.length} boleta${prox.length>1?'s':''} vence${prox.length>1?'n':''} esta semana`, detalle: prox.map(b=>`${b.proveedores?.nombre||'Sin proveedor'}: ${money(b.monto)} (${fdate(b.vence)})`).join(' · '), link:'#contable', tab:'boletas'});
  if(sinV.length) L.push({nivel:'media', grupo:'Pagos', titulo:`${sinV.length} boleta${sinV.length>1?'s':''} sin pagar por ${money(sinV.reduce((a,b)=>a+Number(b.monto),0))}`, detalle: sinV.map(b=>`${b.proveedores?.nombre||'Sin proveedor'}: ${money(b.monto)} (del ${fdate(b.fecha)})`).join(' · '), link:'#contable', tab:'boletas'});
  // Gastos fijos del mes
  const pagadosMes = new Set(gastosMes.map(g=>(g.descripcion||'').toLowerCase()));
  const dia = Number(h.slice(8,10));
  fijos.filter(f=>f.dia_pago && Number(f.monto_mensual)>0 && !pagadosMes.has(f.concepto.toLowerCase())).forEach(f=>{
    const falta = f.dia_pago - dia;
    if(falta <= 5) L.push({nivel: falta<0?'alta':'media', grupo:'Pagos', titulo: `${f.concepto}: ${money(f.monto_mensual)} ${falta<0?'(se pasó el día '+f.dia_pago+')':falta===0?'vence hoy':'vence el día '+f.dia_pago}`, detalle:'Cuando lo pagues, marcalo en Contable → Gastos fijos.', link:'#contable', tab:'fijos'});
  });
  // Cobros atrasados
  const atras = saldos.filter(s=>s.primera_entrega_impaga && s.primera_entrega_impaga <= sumar(h,-7));
  if(atras.length) L.push({nivel:'media', grupo:'Cobros', titulo:`${atras.length} cliente${atras.length>1?'s':''} te debe${atras.length>1?'n':''} hace más de una semana`, detalle: atras.slice(0,8).map(s=>`${s.nombre}: ${money(s.saldo)}`).join(' · ')+(atras.length>8?' …':''), link:'#cobros'});
  // Stock y precios calculados
  const faltan = stock.filter(s=>Number(s.disponible)<0);
  if(faltan.length) L.push({nivel:'alta', grupo:'Stock', titulo:`${faltan.length} producto${faltan.length>1?'s':''} no alcanza${faltan.length>1?'n':''} para los pedidos`, detalle: faltan.map(s=>`${s.nombre}: faltan ${num(-s.disponible)}`).join(' · '), link:'#stock'});
  const prods = cache.productos.filter(p=>p.activo);
  const bajos = prods.filter(p=>p.costo && p.precio && (1-p.costo/p.precio) < 0.15);
  if(bajos.length) L.push({nivel:'media', grupo:'Precios', titulo:`${bajos.length} producto${bajos.length>1?'s':''} con margen menor al 15%`, detalle: bajos.map(p=>`${p.nombre}: ${Math.round((1-p.costo/p.precio)*100)}%`).join(' · ')+'. Revisá el precio o el costo.', link:'#productos'});
  const sinCosto = prods.filter(p=>!p.costo);
  if(sinCosto.length) L.push({nivel:'info', grupo:'Precios', titulo:`${sinCosto.length} producto${sinCosto.length>1?'s':''} sin costo cargado`, detalle: sinCosto.map(p=>p.nombre).join(', ')+'. Sin el costo no se puede calcular la ganancia.', link:'#productos'});
  const viejos = prods.filter(p=>p.actualizado_en && (Date.now()-new Date(p.actualizado_en))/864e5 > 30);
  if(viejos.length) L.push({nivel:'info', grupo:'Precios', titulo:`${viejos.length} precio${viejos.length>1?'s':''} sin actualizar hace más de un mes`, detalle: viejos.map(p=>p.nombre).join(', '), link:'#productos'});
  if(!cache.config.lunes_semana_a && !manuales.some(a=>a.titulo.includes('Semana A'))) L.push({nivel:'media', grupo:'Configuración', titulo:'Cargar un lunes de Semana A', detalle:'Sin esto el sistema no sabe qué barrios tocan cada semana.', link:'#ajustes'});
  const orden = {alta:0, media:1, info:2};
  return L.sort((a,b)=>orden[a.nivel]-orden[b.nivel]);
}
async function badgeAvisos(){ try{ const n=(await calcAvisos()).length; const a=document.querySelector('nav a[data-k="avisos"]'); if(a) a.textContent = n?`Avisos (${n})`:'Avisos'; }catch(e){} }
window.badgeAvisos = badgeAvisos;

async function ruta(){
  const k = (location.hash.slice(1)||'inicio').split('?')[0];
  badgeAvisos();
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', a.dataset.k===k));
  const m = $('#main'); m.innerHTML = '<p class="muted">Cargando…</p>';
  try { await (VISTAS[k]||VISTAS.inicio)(m); } catch(e){ console.error(e); m.innerHTML = '<div class="alert">No se pudo cargar esta sección. Probá de nuevo.</div>'; }
}

/* ---------- Inicio ---------- */
async function semanaYZona(fecha){
  const { data: sem } = await sb.rpc('semana_de', { p_fecha: fecha });
  const dow = ((new Date(fecha+'T12:00').getDay()+6)%7)+1;
  const zonas = cache.zonas.filter(z => z.dia_reparto===dow && (!z.semana || z.semana===sem));
  return { sem, zonas };
}
const VISTAS = {};
VISTAS.inicio = async m => {
  const h = hoy(), lun = lunesDe(h), dom = sumar(lun,6);
  const [{sem, zonas}, pedSem, stock, saldos, repHoy, bols] = await Promise.all([
    semanaYZona(h),
    q(sb.from('v_pedidos').select('id,total,estado').gte('fecha_entrega',lun).lte('fecha_entrega',dom).neq('estado','cancelado')),
    q(sb.from('v_stock').select('*')),
    q(sb.from('v_saldos').select('saldo').gt('saldo',0)),
    q(sb.from('v_pedidos').select('*').eq('fecha_entrega',h).neq('estado','cancelado').order('barrio')),
    q(sb.from('facturas_proveedor').select('monto, vence, proveedores(nombre)').eq('pagada',false))
  ]);
  const faltan = stock.filter(s => Number(s.disponible) < 0);
  const porCobrar = saldos.reduce((a,s)=>a+Number(s.saldo),0);
  const porPagar = bols.reduce((a,b)=>a+Number(b.monto),0);
  calcAvisos().then(L=>{ const u=L.filter(a=>a.nivel!=='info'); const el=$('#avisoIni'); if(el && u.length) el.innerHTML=`<a href="#avisos" class="card" style="display:block;margin-bottom:12px;text-decoration:none;color:inherit;border-color:#E7C98A;background:var(--warn-bg)"><b>Tenés ${u.length} aviso${u.length>1?'s':''} para revisar</b><div class="muted">${u.slice(0,3).map(a=>esc(a.titulo)).join(' · ')}${u.length>3?' …':''}</div></a>`; }).catch(()=>{});
  const dow = ((new Date().getDay()+6)%7)+1;
  const tareas = [];
  if(dow===1){ tareas.push('9:00 · Mandar la difusión de la semana'); tareas.push('Pedir la carne a los proveedores (mirá “Compra sugerida” en Stock)'); tareas.push('19:00 · Recordatorio a los que no pidieron'); }
  if(dow===2){ tareas.push('A la noche llega la carne: registrá la compra y sacale foto a cada boleta (Contable)'); }
  if(dow===3){ tareas.push('A la mañana llega el otro proveedor: registrá la compra y su boleta'); tareas.push('Hoy te van transfiriendo: registrá cada pago en Cobros'); }
  if(dow>=3 && dow<=5 && zonas.length) tareas.push('Reparto de 9 a 14: '+zonas.map(z=>esc(z.nombre)).join(', '));
  if(dow>=3 && dow<=6 && bols.length) tareas.push(`Pagar proveedores: ${bols.length} boletas pendientes por ${money(porPagar)} (Contable)`);
  m.innerHTML = `
  ${!cache.config.lunes_semana_a ? '<div class="alert">Falta cargar un lunes de “Semana A” en Ajustes para que el ciclo de reparto se calcule bien.</div>':''}
  <h2>${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</h2>
  <p class="muted" style="margin-top:-8px">${sem?'Semana '+sem+' · ':''}${zonas.length?'Reparto: '+zonas.map(z=>esc(z.nombre)).join(', '):'Hoy no hay reparto'}</p>
  ${tareas.length?`<div class="card" style="margin-bottom:12px"><b>Para hacer hoy</b><ul style="margin:6px 0 0;padding-left:20px">${tareas.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
  <div id="avisoIni"></div>
  <div class="grid">
    <div class="card metric"><div class="lbl">Pedidos de la semana</div><div class="val">${pedSem.length}</div></div>
    <div class="card metric"><div class="lbl">Vendido esta semana</div><div class="val">${money(pedSem.reduce((a,p)=>a+Number(p.total),0))}</div></div>
    <div class="card metric"><div class="lbl">Por cobrar</div><div class="val">${money(porCobrar)}</div></div>

const tagEstado = e => `<span class="tag ${({entregado:'ok',armado:'acc',confirmado:'warn',cancelado:'bad'})[e]||''}">${esc(e)}</span>`;

/* ---------- Pedidos ---------- */
let semanaPed = null;

/* Resumen de la semana: total por producto y qué encargar a cada proveedor */
async function resumenSemana(m, peds){
  if(!peds.length) return;
  const ids=peds.map(p=>p.id);
  const [its, st] = await Promise.all([q(sb.from('pedido_items').select('producto_id,cantidad,kilos_estimados,pedido_id').in('pedido_id',ids)), q(sb.from('v_stock').select('*'))]);
  const tot={}, kg={}; its.forEach(i=>{ tot[i.producto_id]=(tot[i.producto_id]||0)+Number(i.cantidad); kg[i.producto_id]=(kg[i.producto_id]||0)+Number(i.kilos_estimados||0); });
  const kgDe = (p,c) => p?.unidad==='kg'&&p?.peso_aprox_kg ? ` (≈${num(Math.round(c*p.peso_aprox_kg*10)/10)} kg)` : '';
  const filas=Object.entries(tot).map(([pid,c])=>{ pid=Number(pid); const p=prod(pid), s=st.find(x=>x.producto_id===pid); const hay=Number(s?.fisico||0); const otros=Math.max(0,Number(s?.comprometido||0)-c); const falta=Math.max(0, c+otros-hay); return {pid, p, c, hay, falta}; }).sort((a,b)=>(a.p?.orden??999)-(b.p?.orden??999));
  const provDe = pid => cache.proveedores.filter(pv=>pv.producto_proveedor.some(x=>x.producto_id===pid));
  const porProv={}; filas.filter(f=>f.falta>0).forEach(f=>{ const pv=provDe(f.pid); const k=pv.length===1?pv[0].nombre:(pv.length?pv.map(x=>x.nombre).join(' o '):'Sin proveedor asignado'); (porProv[k]=porProv[k]||[]).push(f); });
  const txt = (k,fs) => `Hola! Te paso el pedido de Granja Los Abrojos para esta semana:\n${fs.map(f=>`- ${f.p?.nombre}: ${num(Math.ceil(f.falta))} ${unidad(f.p?.unidad)}${kgDe(f.p,Math.ceil(f.falta))}`).join('\n')}\nGracias!`;
  m.querySelector('#resSem')?.remove(); if(!m.querySelector('.list')) return;
  m.querySelector('.list').insertAdjacentHTML('beforebegin', `<div class="card" id="resSem" style="margin-bottom:14px"><h3 style="margin-top:0">Total de la semana por producto</h3>
   <div class="scroll"><table><tr><th>Producto</th><th class="n">Pedido esta semana</th><th class="n">Tenés</th><th class="n">Falta encargar</th></tr>${filas.map(f=>`<tr><td>${esc(f.p?.nombre)}</td><td class="n">${num(f.c)} ${unidad(f.p?.unidad)}<div class="muted" style="font-size:12px">${kgDe(f.p,f.c)}</div></td><td class="n">${num(f.hay)}</td><td class="n" style="${f.falta>0?'color:var(--bad);font-weight:600':''}">${f.falta>0?num(Math.ceil(f.falta))+' '+unidad(f.p?.unidad):'✓'}</td></tr>`).join('')}</table></div>
   ${Object.keys(porProv).length?`<h3>Qué encargar a cada proveedor</h3>${Object.entries(porProv).map(([k,fs],i)=>`<div class="item" style="margin-bottom:8px"><div class="row"><b class="sp">${esc(k)}</b><button class="btn sm" data-copiar="${i}">Copiar mensaje</button></div><div class="muted">${fs.map(f=>`${esc(f.p?.nombre)}: ${num(Math.ceil(f.falta))} ${unidad(f.p?.unidad)}`).join(' · ')}</div></div>`).join('')}<p class="muted">“Copiar mensaje” arma el texto del pedido para pegarlo en el WhatsApp del proveedor. Si un producto lo tienen varios proveedores, elegí a quién se lo pedís.</p>`:'<p class="muted">Con lo que tenés alcanza para todos los pedidos de la semana. 👌</p>'}</div>`);
  const entradas=Object.entries(porProv);
  m.querySelectorAll('[data-copiar]').forEach(b=>b.onclick=async()=>{ const [k,fs]=entradas[Number(b.dataset.copiar)]; try{ await navigator.clipboard.writeText(txt(k,fs)); toast('Mensaje copiado: pegalo en el WhatsApp de '+k); }catch(_){ modal('Pedido para '+k, `<textarea style="width:100%;height:160px">${esc(txt(k,fs))}</textarea>`, []); } });
}

  <div class="row muted"><span>${p.fecha_entrega?fdate(p.fecha_entrega):'Sin fecha'} · ${esc(p.barrio||'sin barrio')}</span><span class="sp"></span><b style="color:var(--ink)">${money(p.total)}</b></div>
  ${!p.llega_minimo && p.estado!=='cancelado' ? `<div class="tag warn" style="margin-top:6px">No llega al mínimo de ${money(p.pedido_minimo)}</div>`:''}</div>`).join('') : '<div class="empty">No hay pedidos cargados para esta semana.</div>'}</div>`;

    const its = await q(sb.from('pedido_items').select('*').in('pedido_id',ids));
    excel('Pedidos semana '+semanaPed, its.map(i=>{const p=peds.find(x=>x.id===i.pedido_id), pr=prod(i.producto_id); return {Entrega:p.fecha_entrega, Cliente:p.cliente, Barrio:p.barrio, Producto:pr?.nombre, Cantidad:Number(i.cantidad), 'Peso real':i.peso_real?Number(i.peso_real):'', Precio:Number(i.precio_unitario), Importe:Number(i.importe), Estado:p.estado};}));
  };
  m.querySelectorAll('.item').forEach(el=>el.onclick=()=>verPedido(Number(el.dataset.id)));
};

function opcionesProductos(sel){ let cat=''; return cache.productos.filter(p=>p.activo).map(p=>{let s=''; if(p.categoria!==cat){ if(cat) s+='</optgroup>'; cat=p.categoria; s+=`<optgroup label="${esc(cat)}">`;} return s+`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nombre)} (${money(p.precio)}/${p.unidad==='kg'?'kg':esc(p.unidad)}${piezaTxt(p)})</option>`;}).join('')+'</optgroup>'; }
function filaItem(it={}){ return `<div class="it"><select class="ip">${opcionesProductos(it.producto_id)}</select><input class="ic" type="number" step="1" min="0" placeholder="Unid." value="${it.cantidad??''}"><button class="btn sm" type="button" onclick="this.parentNode.remove()">✕</button></div>`; }

async function formPedido(ped){
  await cargarBase();
  const items = ped ? await q(sb.from('pedido_items').select('*').eq('pedido_id',ped.id)) : [];
  modal(ped?'Editar pedido':'Nuevo pedido', `
    <label>Cliente</label><input id="fcli" list="dlcli" placeholder="Escribí el nombre" value="${esc(ped?cache.clientes.find(c=>c.id===ped.cliente_id)?.nombre:'')}">
    <datalist id="dlcli">${cache.clientes.filter(c=>c.activo).map(c=>`<option value="${esc(c.nombre)}">${esc(c.barrios?.nombre||'')}</option>`).join('')}</datalist>
    <label>Fecha de entrega</label><input id="ffec" type="date" value="${ped?.fecha_entrega||''}"><div class="muted" id="fsug"></div>
    <label>Productos (en unidades: 1 lomo, 2 pollos, 1 maple de huevos)</label><p class="muted" style="margin:0">El precio final sale de los kilos reales que cargás al armar el pedido.</p><div class="items" id="fits">${(items.length?items:[{}]).map(filaItem).join('')}</div>
    <button class="btn sm" type="button" id="fadd">+ Agregar producto</button>
    <label>Notas</label><textarea id="fnot" rows="2">${esc(ped?.notas||'')}</textarea>
    <p class="muted" id="ferr" style="color:var(--bad)"></p>`,
    [['Guardar', ()=>guardarPedido(ped), 'pri']]);
  $('#fadd').onclick=()=>$('#fits').insertAdjacentHTML('beforeend',filaItem());
  $('#fcli').onchange=async()=>{
    const c=cache.clientes.find(x=>x.nombre===$('#fcli').value); if(!c) return;
    if(!$('#ffec').value){ const {data}=await sb.rpc('proxima_entrega',{p_cliente:c.id}); if(data){ $('#ffec').value=data; $('#fsug').textContent='Próximo reparto en su barrio: '+fdate(data);} }
    if(!ped){ const pl=await q(sb.from('plantillas').select('*').eq('cliente_id',c.id)); if(pl.length && confirm('¿Cargar su pedido típico?')) $('#fits').innerHTML=pl.map(filaItem).join(''); }
  };
}
async function guardarPedido(ped){
  const c = cache.clientes.find(x=>x.nombre===$('#fcli').value.trim());
  const err = t => { $('#ferr').textContent=t; };
  if(!c) return err('Elegí un cliente de la lista (o cargalo primero en Clientes).');
  const its = [...document.querySelectorAll('#fits .it')].map(r=>({producto_id:Number(r.querySelector('.ip').value), cantidad:Number(r.querySelector('.ic').value)})).filter(i=>i.cantidad>0);
  if(!its.length) return err('Agregá al menos un producto con cantidad.');
  const datos = { cliente_id:c.id, fecha_entrega:$('#ffec').value||null, notas:$('#fnot').value||null };
  let id = ped?.id;
  if(id){ await q(sb.from('pedidos').update(datos).eq('id',id)); await q(sb.from('pedido_items').delete().eq('pedido_id',id)); }
  else { id = (await q(sb.from('pedidos').insert(datos).select('id').single())).id; }
  await q(sb.from('pedido_items').insert(its.map(i=>({...i, pedido_id:id, precio_unitario:prod(i.producto_id).precio}))));
  dlg.close(); toast('Pedido guardado'); ruta();
}
async function verPedido(id){
  const [p] = await q(sb.from('v_pedidos').select('*').eq('id',id));

  modal('Pedido de '+p.cliente, `<p class="muted">${p.fecha_entrega?fdate(p.fecha_entrega):'Sin fecha'} · ${esc(p.barrio||'')} · ${tagEstado(p.estado)}</p>
  <table><tr><th>Producto</th><th class="n">Unidades</th><th class="n">Kilos</th><th class="n">Importe</th></tr>${its.map(i=>`<tr><td>${esc(prod(i.producto_id)?.nombre)}</td><td class="n">${num(i.cantidad)} ${unidad(prod(i.producto_id)?.unidad)}</td><td class="n">${kgTxt(i)||'—'}</td><td class="n">${i.peso_real==null&&i.kilos_estimados!=null?'≈':''}${money(i.importe)}</td></tr>`).join('')}
  <tr><td colspan="3"><b>Total</b></td><td class="n"><b>${money(p.total)}</b></td></tr></table>

   ['Guardar estado', async()=>{ await q(sb.from('pedidos').update({estado:$('#vest').value}).eq('id',id)); dlg.close(); toast('Estado actualizado'); ruta(); },'pri']]);

  <h3>Compra sugerida por proveedor</h3><div id="sug"></div>`;
  const porProv = {}; filas.filter(f=>f.comprar>0).forEach(f=>{ const pv = provDe(f.producto_id)||'Sin proveedor asignado'; (porProv[pv]=porProv[pv]||[]).push(f); });

  $('#xls').onclick=()=>excel('Stock '+hoy(), filas.map(s=>({Categoría:s.categoria, Producto:s.nombre, Unidad:s.unidad, Hay:Number(s.fisico), Pedido:Number(s.comprometido), Disponible:Number(s.disponible), 'Semana A (normal)':s.estA, 'Semana B (normal)':s.estB, Comprar:s.comprar})));

    <label>Cantidad</label><input id="ac" type="number" step="0.1"><p class="muted">En “Ajuste” usá negativo para restar. La merma siempre resta.</p>`,

/* ---------- Foto de boleta → compra ---------- */
async function achicarFoto(f){ const img=await createImageBitmap(f); const k=Math.min(1,1800/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); }
function filaBoleta(it={}){ return `<div class="it row" style="gap:6px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap"><div style="flex:2;min-width:180px"><select class="bp"><option value="">— Elegí el producto —</option>${[...cache.productos].sort((a,b)=>(a.orden??999)-(b.orden??999)).map(p=>`<option value="${p.id}" ${p.id===it.producto_id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>${it.texto?`<div class="muted" style="font-size:12px">En la boleta: “${esc(it.texto)}”</div>`:''}</div><input class="bc" type="number" step="1" min="0" placeholder="Unidades" title="Unidades (piezas, bolsas, maples)" value="${it.unidades??''}" style="width:85px"><input class="bk" type="number" step="0.01" min="0" placeholder="Kilos" title="Kilos" value="${it.kilos??''}" style="width:85px"><input class="bu" type="number" step="1" min="0" placeholder="Costo x kg" value="${it.precio_unitario??''}" style="width:110px"><button class="btn sm" type="button" onclick="this.parentElement.remove()" title="Quitar">✕</button></div>`; }
async function revisarBoleta(path, L, aviso){
  await cargarBase();
  const {data:u}=await sb.storage.from('comprobantes').createSignedUrl(path, 3600);
  const sumaItems = (L.items||[]).reduce((a,i)=>a+(Number(i.importe)||(Number(i.kilos??i.unidades)*Number(i.precio_unitario))||0),0);
  modal('Revisá la boleta', `${aviso?`<p style="color:var(--bad)">${esc(aviso)}</p>`:'<p class="muted">Esto es lo que se leyó. Revisalo, corregí lo que haga falta y confirmá.</p>'}
    ${u?.signedUrl?`<a href="${u.signedUrl}" target="_blank" rel="noopener"><img src="${u.signedUrl}" style="max-width:100%;max-height:220px;border-radius:8px;display:block;margin:6px 0"></a>`:''}
    ${L.dudas?`<p class="muted" style="background:#FBF3E4;padding:8px;border-radius:8px">⚠️ ${esc(L.dudas)}</p>`:''}
    <label>Proveedor</label><select id="bpv"><option value="">— Elegí —</option>${cache.proveedores.map(p=>`<option value="${p.id}" ${p.id===L.proveedor_id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>${L.proveedor_texto&&!L.proveedor_id?`<div class="muted" style="font-size:12px">En la boleta dice: “${esc(L.proveedor_texto)}”</div>`:''}
    <div class="row" style="gap:8px"><div style="flex:1"><label>Fecha</label><input id="bfe" type="date" value="${L.fecha||hoy()}"></div><div style="flex:1"><label>Número</label><input id="bnu" value="${esc(L.numero||'')}"></div><div style="flex:1"><label>Vence</label><input id="bve" type="date" value="${L.vence||''}"></div></div>
    <label>Qué entró</label><p class="muted" style="margin:0 0 6px">Unidades = piezas, bolsas o maples (es lo que suma al stock). Kilos y costo por kilo = lo que dice la boleta.</p><div id="bits">${(L.items&&L.items.length?L.items:[{}]).map(filaBoleta).join('')}</div><button class="btn sm" type="button" id="badd">+ Agregar renglón</button>
    <label>Total de la boleta</label><input id="bto" type="number" step="1" min="0" value="${L.total??(sumaItems?Math.round(sumaItems):'')}">
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="bpg" style="width:auto"> Ya la pagué</label>
    <div id="bpgx" style="display:none"><label>Cómo</label><select id="bmd"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option></select></div>`,
    [['Confirmar compra', async()=>{
      const prov=$('#bpv').value?Number($('#bpv').value):null; if(!prov) return toast('Elegí el proveedor');
      const filas=[...document.querySelectorAll('#bits .it')].map(r=>({producto_id:Number(r.querySelector('.bp').value)||null, cantidad:Number(r.querySelector('.bc').value)||0, kilos:Number(r.querySelector('.bk').value)||null, costo_unitario:Number(r.querySelector('.bu').value)||null})).filter(i=>i.cantidad>0||i.producto_id);
      if(!filas.length) return toast('Agregá al menos un producto');
      if(filas.some(i=>!i.producto_id)) return toast('Hay un renglón sin producto elegido: elegilo o quitalo con ✕');
      if(filas.some(i=>!(i.cantidad>0))) return toast('Poné cuántas unidades (piezas, bolsas o maples) entraron de cada producto');
      const total=Number($('#bto').value)||filas.reduce((a,i)=>a+(i.kilos??i.cantidad)*(i.costo_unitario||0),0)||null;
      const fecha=$('#bfe').value||hoy(), pagada=$('#bpg').checked;
      const c=await q(sb.from('compras').insert({proveedor_id:prov, fecha, total, comprobante_url:path, notas:$('#bnu').value?('Boleta '+$('#bnu').value):null}).select('id').single());
      await q(sb.from('compra_items').insert(filas.map(i=>({...i, compra_id:c.id}))));
      await q(sb.from('facturas_proveedor').insert({proveedor_id:prov, fecha, numero:$('#bnu').value||null, monto:total||0, vence:$('#bve').value||null, foto_path:path, pagada, fecha_pago:pagada?hoy():null, medio_pago:pagada?$('#bmd').value:null}));
      const costos=filas.filter(i=>i.costo_unitario>0); if(costos.length) await q(sb.from('producto_proveedor').upsert(costos.map(i=>({producto_id:i.producto_id, proveedor_id:prov, costo:i.costo_unitario})),{onConflict:'producto_id,proveedor_id'}));
      dlg.close(); cargarBase(true); toast(pagada?'Compra cargada y boleta marcada como pagada':'Compra cargada: sumó al stock y la boleta quedó “a pagar”'); ruta(); },'pri']]);
  $('#badd').onclick=()=>$('#bits').insertAdjacentHTML('beforeend',filaBoleta());
  $('#bpg').onchange=()=>$('#bpgx').style.display=$('#bpg').checked?'block':'none';
}
VISTAS.compras = async m => {
  const compras = await q(sb.from('compras').select('*, proveedores(nombre), compra_items(cantidad, producto_id)').order('fecha',{ascending:false}).limit(40));

  <p class="muted">Sacale una foto a la boleta del proveedor: el sistema la lee y te arma la compra. Vos revisás, confirmás, y queda todo hecho: suma el stock, guarda los costos y deja la boleta en “a pagar” con la foto.</p>
  <div class="list">${compras.length?compras.map(c=>`<div class="item"><div class="row"><b class="sp">${esc(c.proveedores?.nombre||'Sin proveedor')}</b><span class="muted">${fdate(c.fecha)}</span><button class="btn sm danger" data-delcompra="${c.id}">Borrar</button></div><div class="muted">${c.compra_items.map(i=>`${esc(prod(i.producto_id)?.nombre)} ${num(i.cantidad)}`).join(' · ')}</div>${c.total?`<b>${money(c.total)}</b>`:''}</div>`).join(''):'<div class="empty">Todavía no hay compras registradas.</div>'}</div>`;
  m.querySelectorAll('[data-delcompra]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta compra? También se descuenta del stock.')) return; await q(sb.from('compras').delete().eq('id',Number(b.dataset.delcompra))); toast('Compra borrada'); ruta(); });
  $('#foto').onclick=()=>$('#ffoto').click();

    try{
      const blob = await achicarFoto(f);

      const {data, error}=await sb.functions.invoke('leer-boleta',{body:{path}});
      let lectura=null, aviso='';
      if(error||!data?.ok){ let msg=data?.error||''; try{ msg = msg || (await error.context.json()).error; }catch(_){} aviso = (msg||'No se pudo leer la boleta')+'. Completala a mano: la foto ya quedó guardada.'; }
      else lectura=data.lectura;
      revisarBoleta(path, lectura||{items:[{}]}, aviso);
    }catch(err){ toast(err.message||String(err)); }
    b.disabled=false; b.textContent='📷 Subir foto de la boleta'; };
  $('#nueva').onclick=()=>{ modal('Registrar compra', `<label>Proveedor</label><select id="cp"><option value="">—</option>${cache.proveedores.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>
    <label>Fecha</label><input id="cf" type="date" value="${hoy()}">

    <label>Total pagado (opcional)</label><input id="ct" type="number" step="1" min="0">`,
    [['Guardar', async()=>{ const its=[...document.querySelectorAll('#cits .it')].map(r=>({producto_id:Number(r.querySelector('.ip').value), cantidad:Number(r.querySelector('.ic').value)})).filter(i=>i.cantidad>0); if(!its.length) return toast('Agregá al menos un producto');
      const c = await q(sb.from('compras').insert({proveedor_id:$('#cp').value?Number($('#cp').value):null, fecha:$('#cf').value, total:$('#ct').value?Number($('#ct').value):null}).select('id').single());
      await q(sb.from('compra_items').insert(its.map(i=>({...i, compra_id:c.id})))); dlg.close(); toast('Compra registrada'); ruta(); },'pri']]);
    $('#cadd').onclick=()=>$('#cits').insertAdjacentHTML('beforeend',filaItem()); };

function detalleTexto(s, peds, its){
  const lineas = peds.slice(0,3).reverse().map(p=>`Entrega del ${fdate(p.fecha_entrega)}:\n`+its.filter(i=>i.pedido_id===p.id).map(i=>{const pr=prod(i.producto_id); const k=i.peso_real??i.kilos_estimados; return `- ${num(i.cantidad)} ${pr?.nombre}${pr?.unidad==='kg'&&k!=null?` (${num(Number(k))} kg x ${money(i.precio_unitario)})`:''}: ${money(i.importe)}`;}).join('\n')+`\nTotal: ${money(p.total)}`).join('\n\n');
  return `Hola ${s.nombre.split(' ')[0]}! Te paso el detalle de Granja Los Abrojos:\n\n${lineas}\n\nSaldo pendiente: ${money(s.saldo)}. ¡Gracias!`;
}

/* ---------- Planillas (se arman solas con los datos del sistema) ---------- */
const NO_PLATA = new Set(['Hay','Pedido','Disponible','Mínimo','Día de pago','Margen %','Recargo %','Diferencia %']);
let hojaSel = 'TOTALES';
async function armarPlanillas(){
  await cargarBase();
  const [res, hist, ped, gas, fij, comp, st, sal, bol] = await Promise.all([
    q(sb.from('v_resultado_mensual').select('*').order('mes',{ascending:false})),
    q(sb.from('ingresos_historicos').select('*').order('fecha',{ascending:false})),
    q(sb.from('v_pedidos').select('*').order('fecha_entrega',{ascending:false}).limit(2000)),
    q(sb.from('gastos').select('*').order('fecha',{ascending:false})),
    q(sb.from('gastos_fijos').select('*').order('concepto')),
    q(sb.from('competencia').select('*')),
    q(sb.from('v_stock').select('*')),
    q(sb.from('v_saldos').select('*').gt('saldo',0).order('saldo',{ascending:false})),
    q(sb.from('facturas_proveedor').select('*').order('fecha',{ascending:false}))
  ]);
  const cli = id => cache.clientes.find(c=>c.id===id);
  const barrioDe = c => cache.barrios?.find(b=>b.id===c?.barrio_id)?.nombre || '';
  const provN = id => cache.proveedores.find(p=>p.id===id)?.nombre || '';
  const ordenP = (a,b)=>(a.orden??999)-(b.orden??999);
  const comps = [...new Set(comp.map(c=>c.competidor))];
  const H = {};
  H['TOTALES'] = res.filter(r=>Number(r.ganancia_bruta)||Number(r.gastos)).map(r=>({Mes:mesTxt(r.mes), 'Ganancia':Number(r.ganancia_bruta), 'Gastos':Number(r.gastos), 'Resultado':Number(r.resultado), 'Cobrado':Number(r.cobrado||0), 'Boletas proveedores':Number(r.boletas_proveedores||0)}));
  H['INGRESOS'] = [
    ...ped.filter(p=>p.estado==='entregado').map(p=>({Fecha:p.fecha_entrega, Reparto:barrioDe(cli(p.cliente_id)), Detalle:cli(p.cliente_id)?.nombre||'', 'Venta':Number(p.total), Origen:'Sistema'})),
    ...hist.map(h=>({Fecha:h.fecha, Reparto:h.categoria||'', Detalle:h.descripcion||'', 'Venta':Number(h.monto), Origen:'Planilla (ganancia)'}))
  ].sort((a,b)=>b.Fecha.localeCompare(a.Fecha));
  H['EGRESOS'] = gas.map(g=>({Fecha:g.fecha, Categoría:g.categoria, Descripción:g.descripcion||'', Medio:g.medio||'', 'Monto':Number(g.monto)}));
  H['Gastos Fijos'] = fij.map(f=>({Concepto:f.concepto, Categoría:f.categoria||'', Clasificación:f.clasificacion||'', 'Monto mensual':Number(f.monto_mensual), 'Día de pago':f.dia_pago??'', Activo:f.activo?'Sí':'No'}));
  H['Precios'] = [...cache.productos].sort(ordenP).map(p=>{ const fila={Producto:p.nombre, 'Precio venta':Number(p.precio), 'Costo':Number(p.costo||0)};
    cache.proveedores.forEach(pv=>{ const x=pv.producto_proveedor.find(y=>y.producto_id===p.id); if(x) fila['Costo '+pv.nombre]=Number(x.costo||0); });
    fila['Margen %']=p.costo&&p.precio?Math.round((1-p.costo/p.precio)*100):''; return fila; });
  const colsProv = cache.proveedores.map(pv=>'Costo '+pv.nombre).filter(k=>H['Precios'].some(f=>k in f));
  H['Precios'] = H['Precios'].map(f=>{ const o={Producto:f.Producto,'Precio venta':f['Precio venta'],'Costo':f.Costo}; colsProv.forEach(k=>o[k]=f[k]??''); o['Margen %']=f['Margen %']; return o; });
  H['Competencia'] = [...cache.productos].sort(ordenP).filter(p=>comp.some(c=>c.producto_id===p.id)).map(p=>{ const o={Producto:p.nombre,'Nuestro precio':Number(p.precio)}; comps.forEach(c=>{const x=comp.find(y=>y.producto_id===p.id&&y.competidor===c); o[c]=x?Number(x.precio):'';}); o['Actualizado']=comp.filter(y=>y.producto_id===p.id).map(y=>y.fecha).sort().pop()||''; const vals=comps.map(c=>o[c]).filter(v=>v!==''); const prom=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0; o['Diferencia %']=prom?Math.round((p.precio/prom-1)*100):''; return o; });
  H['Stock'] = st.map(s=>({p:prod(s.producto_id), s})).sort((a,b)=>ordenP(a.p||{},b.p||{})).map(({p,s})=>({Producto:p?.nombre||'', Hay:Number(s.fisico), Pedido:Number(s.comprometido), Disponible:Number(s.disponible), Mínimo:Number(s.stock_minimo||0)}));
  H['Reparto'] = ped.filter(p=>['pendiente','confirmado','armado'].includes(p.estado)).sort((a,b)=>a.fecha_entrega.localeCompare(b.fecha_entrega)).map(p=>{const c=cli(p.cliente_id); return {Fecha:p.fecha_entrega, Barrio:barrioDe(c), Cliente:c?.nombre||'', Lote:c?.lote||'', Teléfono:c?.telefono||'', Estado:p.estado, 'Total':Number(p.total)};});
  H['Cobros'] = sal.map(s=>({Cliente:s.nombre, Barrio:s.barrio||'', 'Debe':Number(s.saldo), 'Desde':s.primera_entrega_impaga||''}));
  H['Facturas'] = bol.map(b=>({Fecha:b.fecha, Proveedor:provN(b.proveedor_id), Número:b.numero||'', 'Monto':Number(b.monto), Vence:b.vence||'', Pagada:b.pagada?'Sí':'No', 'Fecha de pago':b.fecha_pago||'', Medio:b.medio_pago||''}));
  return H;
}

const AGREGAR = {

VISTAS.planillas = async m => {
  const H = await armarPlanillas();
  const nombres = Object.keys(H);
  if(!H[hojaSel]) hojaSel = nombres[0];
  const celda = (k,v) => v===''||v==null ? '' : typeof v==='number' ? (NO_PLATA.has(k)? (k.endsWith('%')? v+'%' : num(v)) : money(v)) : /^\d{4}-\d{2}-\d{2}$/.test(v) ? fdate(v) : esc(v);
  const filas = H[hojaSel], cols = filas.length ? Object.keys(filas[0]) : [];
  m.innerHTML = `<div class="row"><h2 class="sp">Planillas</h2><button class="btn pri" id="todas">Descargar todas en Excel</button></div>
   <p class="muted">Son tus mismas planillas, pero se completan solas con lo que cargás en el sistema (pedidos, pagos, gastos, boletas, precios). No hace falta tocarlas: abrís la que necesitás o te bajás todas juntas en un Excel.</p>
   <div class="row" style="flex-wrap:wrap;gap:6px;margin:10px 0">${nombres.map(n=>`<button class="btn sm ${n===hojaSel?'pri':''}" data-hoja="${esc(n)}">${esc(n)} <span class="muted" style="${n===hojaSel?'color:inherit':''}">(${H[n].length})</span></button>`).join('')}</div>
   <div class="row"><h3 class="sp">${esc(hojaSel)}</h3>${AGREGAR[hojaSel]?`<button class="btn sm pri" id="agr">+ Agregar</button>`:'<span class="muted" style="font-size:13px">Se calcula sola</span>'}<button class="btn sm" id="una">Descargar esta hoja</button></div>
   ${filas.length?`<div class="scroll"><table class="hoja"><tr>${cols.map(c=>`<th class="${typeof filas[0][c]==='number'?'n':''}">${esc(c)}</th>`).join('')}</tr>${filas.map(f=>`<tr>${cols.map(c=>`<td class="${typeof f[c]==='number'?'n':''}">${celda(c,f[c])}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty">Todavía no hay datos para esta planilla. Se va a llenar sola a medida que uses el sistema.</div>'}`;
  m.querySelectorAll('[data-hoja]').forEach(b=>b.onclick=()=>{ hojaSel=b.dataset.hoja; ruta(); });
  if($('#agr')) $('#agr').onclick=()=>AGREGAR[hojaSel]();
  $('#una').onclick=()=>excel(hojaSel, filas);
  $('#todas').onclick=()=>{ const wb=XLSX.utils.book_new(); nombres.forEach(n=>{ const ws=H[n].length?XLSX.utils.json_to_sheet(H[n]):XLSX.utils.aoa_to_sheet([['Sin datos todavía']]); if(H[n].length) ws['!cols']=Object.keys(H[n][0]).map(k=>({wch:Math.max(k.length, ...H[n].slice(0,200).map(f=>String(f[k]??'').length))+2})); XLSX.utils.book_append_sheet(wb,ws,n.slice(0,30)); }); XLSX.writeFile(wb, `Granja Los Abrojos - Planillas ${hoy()}.xlsx`); };
};

};

TABS_CONT.ingresos = async el => {
  const anioSel = new Date().getFullYear();
  const [hist, ventas] = await Promise.all([
    q(sb.from('ingresos_historicos').select('*').gte('fecha',`${anioSel}-01-01`).order('fecha',{ascending:false})),
    q(sb.from('v_resultado_mensual').select('mes,ventas,costo_mercaderia').gte('mes',`${anioSel}-01-01`))
  ]);
  const meses = [...new Set([...hist.map(h=>h.fecha.slice(0,7)), ...ventas.filter(v=>Number(v.ventas)).map(v=>v.mes.slice(0,7))])].sort().reverse();
  const cats = [...new Set(hist.map(h=>h.categoria||'Otros'))].sort();

  el.innerHTML = `<p class="muted">Lo que ganaste en cada reparto (ventas menos lo que pagás a los proveedores). Hasta noviembre viene de tu planilla; desde que uses el sistema se calcula solo con los pedidos entregados.</p>

   <div class="scroll"><table><tr><th>Mes</th>${cats.map(c=>`<th class="n">${esc(c)}</th>`).join('')}<th class="n">Con el sistema</th><th class="n">Total</th></tr>
   ${meses.map(m=>`<tr><td>${mesTxt(m+'-01')}</td>${cats.map(c=>`<td class="n">${sumH(m,c)?money(sumH(m,c)):'—'}</td>`).join('')}<td class="n">${ganSis(m)?money(ganSis(m)):'—'}</td><td class="n"><b>${money(sumH(m,null)+ganSis(m))}</b></td></tr>`).join('')}
   <tr style="background:#FBF8F4"><td><b>Total del año</b></td>${cats.map(c=>`<td class="n"><b>${money(hist.filter(h=>(h.categoria||'Otros')===c).reduce((a,h)=>a+Number(h.monto),0))}</b></td>`).join('')}<td class="n"><b>${money(meses.reduce((a,m)=>a+ganSis(m),0))}</b></td><td class="n"><b>${money(hist.reduce((a,h)=>a+Number(h.monto),0)+meses.reduce((a,m)=>a+ganSis(m),0))}</b></td></tr></table></div>

   <h3>Detalle</h3>
   <div class="scroll"><table><tr><th>Fecha</th><th>Reparto</th><th>Descripción</th><th class="n">Ganancia</th></tr>${hist.map(h=>`<tr><td>${fdate(h.fecha)}</td><td>${esc(h.categoria||'')}</td><td>${esc(h.descripcion||'')}</td><td class="n">${money(h.monto)}</td></tr>`).join('')}</table></div>`;
  $('#xls').onclick=()=>excel('Ingresos '+anioSel, hist.map(h=>({Fecha:h.fecha, Reparto:h.categoria, Descripción:h.descripcion, Ganancia:Number(h.monto)})));
};

  el.querySelectorAll('[data-pagar]').forEach(b=>b.onclick=()=>modal('Marcar boleta pagada', `<label>Fecha de pago</label><input id="fp" type="date" value="${hoy()}"><label>Medio</label><select id="mp"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="otro">Otro</option></select>`,
    [['Guardar', async()=>{ await q(sb.from('facturas_proveedor').update({pagada:true, fecha_pago:$('#fp').value, medio_pago:$('#mp').value}).eq('id',Number(b.dataset.pagar))); dlg.close(); toast('Boleta pagada'); ruta(); },'pri']]));
  el.querySelectorAll('[data-despagar]').forEach(b=>b.onclick=async()=>{ await q(sb.from('facturas_proveedor').update({pagada:false, fecha_pago:null, medio_pago:null}).eq('id',Number(b.dataset.despagar))); ruta(); });
  el.querySelectorAll('[data-delbol]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta boleta?')) return; const x=bols.find(y=>y.id===Number(b.dataset.delbol)); if(x?.foto_path) await sb.storage.from('comprobantes').remove([x.foto_path]); await q(sb.from('facturas_proveedor').delete().eq('id',x.id)); toast('Boleta borrada'); ruta(); });
  $('#nb').onclick=()=>{ modal('Cargar boleta de proveedor', `<label>Foto de la boleta</label><input id="bf" type="file" accept="image/*,application/pdf" capture="environment">
    <label>Proveedor</label><select id="bp"><option value="">—</option>${cache.proveedores.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>
    <label>Fecha</label><input id="bd" type="date" value="${hoy()}"><label>Monto total</label><input id="bm" type="number" min="0" step="1">
    <label>Número de boleta (opcional)</label><input id="bn"><label>Vence (opcional)</label><input id="bv" type="date">
    <label><input type="checkbox" id="bpag" style="width:auto"> Ya está pagada</label><p class="muted" id="berr" style="color:var(--bad)"></p>`,
    [['Guardar', async()=>{ const monto=Number($('#bm').value); if(!(monto>0)){ $('#berr').textContent='Poné el monto de la boleta.'; return; }
      let foto_path=null; const f=$('#bf').files[0];
      if(f){ const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''); foto_path=`boletas/${hoy()}-${Date.now()}.${ext}`; const {error}=await sb.storage.from('comprobantes').upload(foto_path, f); if(error){ $('#berr').textContent='No se pudo subir la foto: '+error.message; return; } }
      const pag=$('#bpag').checked;
      await q(sb.from('facturas_proveedor').insert({proveedor_id:$('#bp').value?Number($('#bp').value):null, fecha:$('#bd').value, monto, numero:$('#bn').value||null, vence:$('#bv').value||null, foto_path, pagada:pag, fecha_pago:pag?hoy():null}));
      dlg.close(); toast('Boleta cargada'); ruta(); },'pri']]); };
};
let mesGastos = null;
TABS_CONT.gastos = async el => {
  mesGastos = mesGastos || hoy().slice(0,7);
  const desde = mesGastos+'-01'; const h = new Date(desde+'T12:00'); h.setMonth(h.getMonth()+1); const hasta = iso(h);
  const gs = await q(sb.from('gastos').select('*').gte('fecha',desde).lt('fecha',hasta).order('fecha',{ascending:false}));
  el.innerHTML = `<div class="row"><input type="month" id="gm" value="${mesGastos}" style="width:auto"><span class="sp"></span><button class="btn pri" id="ng">Cargar gasto</button><button class="btn sm" id="xls">Descargar Excel</button></div>
   <p class="muted">Sueldos, nafta, ARCA, contador, mensajes de WhatsApp y todo lo que no es mercadería. Total del mes: <b>${money(gs.reduce((a,g)=>a+Number(g.monto),0))}</b></p>
   ${gs.length?`<div class="scroll"><table><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th class="n">Monto</th><th></th></tr>${gs.map(g=>`<tr><td>${fdate(g.fecha)}</td><td>${esc(g.categoria)}</td><td>${esc(g.descripcion||'')}</td><td class="n">${money(g.monto)}</td><td><button class="btn sm danger" data-delg="${g.id}">Borrar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay gastos cargados este mes.</div>'}`;
  $('#gm').onchange=e=>{ mesGastos=e.target.value; ruta(); };
  $('#xls').onclick=()=>excel('Gastos '+mesGastos, gs.map(g=>({Fecha:g.fecha, Categoría:g.categoria, Descripción:g.descripcion, Monto:Number(g.monto)})));
  el.querySelectorAll('[data-delg]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar este gasto?')) return; await q(sb.from('gastos').delete().eq('id',Number(b.dataset.delg))); toast('Gasto borrado'); ruta(); });
  $('#ng').onclick=()=>modal('Cargar gasto', `<label>Fecha</label><input id="gf" type="date" value="${hoy()}"><label>Categoría</label><select id="gc">${CATS_GASTO.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Descripción</label><input id="gd" placeholder="Nafta, pago empleado, monotributo…"><label>Monto</label><input id="gmo" type="number" min="1" step="1">`,
    [['Guardar', async()=>{ const monto=Number($('#gmo').value); if(!(monto>0)) return toast('Poné el monto'); await q(sb.from('gastos').insert({fecha:$('#gf').value, categoria:$('#gc').value, descripcion:$('#gd').value||null, monto})); dlg.close(); toast('Gasto cargado'); ruta(); },'pri']]);
};
TABS_CONT.fijos = async el => {
  const mes = hoy().slice(0,7);
  const [fs, gm] = await Promise.all([q(sb.from('gastos_fijos').select('*').order('id')), q(sb.from('gastos').select('descripcion').gte('fecha',mes+'-01'))]);
  const pagados = new Set(gm.map(g=>(g.descripcion||'').toLowerCase()));
  el.innerHTML = `<p class="muted">Lo que pagás todos los meses. Poné el día del mes en que vence y te va a aparecer en Avisos unos días antes. Cuando lo pagues, tocá “Pagado”: se anota solo en Gastos. Total mensual: <b>${money(fs.filter(f=>f.activo).reduce((a,f)=>a+Number(f.monto_mensual),0))}</b></p>
   <div class="scroll"><table><tr><th>Concepto</th><th class="n">Monto por mes</th><th class="n">Vence el día</th><th>Categoría</th><th>Este mes</th><th>Activo</th></tr>${fs.map(f=>`<tr><td>${esc(f.concepto)}</td><td class="n"><input data-ff="monto_mensual" data-id="${f.id}" type="number" min="0" step="1000" value="${Number(f.monto_mensual)}" style="width:120px;text-align:right"></td>
     <td class="n"><input data-ff="dia_pago" data-id="${f.id}" type="number" min="1" max="31" value="${f.dia_pago??''}" style="width:70px;text-align:right"></td>
     <td><select data-ff="categoria" data-id="${f.id}" style="width:auto">${CATS_GASTO.map(c=>`<option ${f.categoria===c?'selected':''}>${c}</option>`).join('')}</select></td>
     <td>${pagados.has(f.concepto.toLowerCase())?'<span class="tag ok">Pagado</span>':`<button class="btn sm" data-pagf="${f.id}">Pagado</button>`}</td>
     <td><input data-ff="activo" data-id="${f.id}" type="checkbox" ${f.activo?'checked':''} style="width:auto"></td></tr>`).join('')}</table></div>
   <div style="margin-top:10px"><button class="btn sm" id="nf">+ Agregar gasto fijo</button></div>`;
  el.querySelectorAll('[data-ff]').forEach(i=>i.onchange=async()=>{ const f=i.dataset.ff; const v = f==='activo'?i.checked : f==='categoria'?i.value : f==='dia_pago'?(i.value?Number(i.value):null) : Number(i.value||0); await q(sb.from('gastos_fijos').update({[f]: v}).eq('id',Number(i.dataset.id))); toast('Guardado'); ruta(); });
  el.querySelectorAll('[data-pagf]').forEach(b=>b.onclick=()=>{ const f=fs.find(x=>x.id===Number(b.dataset.pagf)); modal('Registrar pago de '+f.concepto, `<label>Monto pagado</label><input id="pfm" type="number" min="1" value="${Number(f.monto_mensual)}"><label>Fecha</label><input id="pff" type="date" value="${hoy()}">`,
    [['Guardar', async()=>{ const monto=Number($('#pfm').value); if(!(monto>0)) return toast('Poné el monto'); await q(sb.from('gastos').insert({fecha:$('#pff').value, categoria:f.categoria||'Otros', descripcion:f.concepto, monto})); dlg.close(); toast('Pago anotado en Gastos'); ruta(); },'pri']]); });
  $('#nf').onclick=async()=>{ const n=prompt('Concepto (ej. Alquiler depósito)'); if(!n||!n.trim()) return; const v=Number(prompt('Monto por mes')||0); await q(sb.from('gastos_fijos').insert({concepto:n.trim(), monto_mensual:v})); ruta(); };
};
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN' && !usuario) iniciar(); });
iniciar();
</script>
</body>
</html>
