<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.card{max-width:560px;margin:48px auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:32px}
.card h1{font-size:34px;margin:12px 0 6px}
.state{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px}
.state.confirmado{background:#E3F1E8;color:var(--ok)} .state.cancelado{background:#F7E3E0;color:var(--bad)} .state.atendido{background:var(--soft);color:var(--muted)} .state.ausente{background:#FBEFD9;color:var(--warn)}
.rows{margin:22px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row span{color:var(--muted)} .row b{text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.modal{position:fixed;inset:0;background:rgba(24,32,27,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.on{display:flex}
.modal .box{background:var(--card);border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h2{font-size:24px;margin-bottom:8px}
.modal .actions{margin-top:20px;justify-content:flex-end}
.freed{margin-top:18px;padding:14px 16px;border-radius:12px;background:#E3F1E8;color:var(--ok);font-size:14px;font-weight:500}
@media (max-width:520px){.card{margin:20px 14px 0;padding:24px}}
</style>
</head>
<body>
<main id="app"><div class="spinner"></div></main>
<p class="powered">Reservas online por <a href="https://me-encargo.vercel.app" target="_blank" rel="noopener">Me Encargo</a></p>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="box"><h2 id="mt">¿Cancelar el turno?</h2><p class="muted">El horario queda libre para otra persona. No se puede deshacer.</p>
  <div class="actions"><button class="btn ghost" id="no">Volver</button><button class="btn danger" id="yes">Sí, cancelar</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script>
(function(){
  const { sb, esc, hora, ymd, fechaLarga, toast, gcal } = ME;
  const token = new URLSearchParams(location.search).get('t');
  const app = document.getElementById('app'), modal = document.getElementById('modal');
  const LBL = { confirmado:'● Confirmado', cancelado:'● Cancelado', atendido:'● Atendido', ausente:'● No asistió' };
  load();
  async function load(freed){
    if (!token) return fail();
    const { data, error } = await sb.rpc('publico_turno', { p_token: token });
    if (error || !data) return fail();
    draw(data, freed);
  }
  function fail(){ app.innerHTML = '<div class="card"><h1>No encontramos este turno</h1><p class="muted">Revisá que el link esté completo.</p></div>'; }
  function draw(t, freed){
    document.title = 'Tu turno · ' + t.negocio;
    const f = ymd(t.inicio, t.tz);
    app.innerHTML = `<div class="card">
      <span class="state ${t.estado}">${LBL[t.estado]}</span>
      <h1>${esc(t.negocio)}</h1>
      <p class="muted">Hola ${esc(t.cliente.split(' ')[0])}, este es tu turno.</p>
      <div class="rows">
        <div class="row"><span>Servicio</span><b>${esc(t.servicio)}</b></div>
        <div class="row"><span>Profesional</span><b>${esc(t.profesional)}</b></div>
        <div class="row"><span>Cuándo</span><b>${esc(fechaLarga(f))} · ${hora(t.inicio, t.tz)} hs</b></div>
        ${t.direccion?`<div class="row"><span>Dónde</span><b>${esc(t.direccion)}</b></div>`:''}
      </div>
      <div class="actions">
        ${t.estado==='confirmado'?`<a class="btn" target="_blank" rel="noopener" href="${gcal(t.servicio+' · '+t.negocio, t.inicio, t.fin, t.direccion)}">Agregar a mi calendario</a>`:''}
        ${t.puede_cancelar?'<button class="btn ghost" id="cancel">Cancelar turno</button>':''}
        <a class="btn ghost" href="./?n=${encodeURIComponent(t.slug)}">${t.estado==='cancelado'?'Reservar otro turno':'Reservar otro'}</a>
      </div>
      ${t.estado==='confirmado'&&!t.puede_cancelar?`<p class="muted" style="font-size:14px;margin-top:16px">Faltan menos de ${t.cancelacion_horas} h: para cancelar comunicate con el negocio${t.telefono?' al '+esc(t.telefono):''}.</p>`:''}
      ${freed?'<div class="freed">Listo: tu turno quedó cancelado y el horario se liberó para otra persona.</div>':''}
    </div>`;
    const c = document.getElementById('cancel'); if (c) c.onclick = () => { modal.classList.add('on'); document.getElementById('no').focus(); };
  }
  document.getElementById('no').onclick = () => modal.classList.remove('on');
  modal.onclick = e => { if (e.target === modal) modal.classList.remove('on'); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('on'); });
  document.getElementById('yes').onclick = async () => {
    const b = document.getElementById('yes'); b.disabled = true; b.textContent = 'Cancelando…';
    const { error } = await sb.rpc('publico_cancelar', { p_token: token });
    modal.classList.remove('on'); b.disabled = false; b.textContent = 'Sí, cancelar';
    if (error) return toast(ME.err(error), 'bad');
    load(true);
  };
})();
</script>
</body>
</html>
